<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 26 222 126" role="img" aria-label="kreativ-anders Status"><style>
svg{color-scheme:light dark}
.frame{fill:#FFA500}
.text{fill:#141210}
.ok{fill:#2E7D32}.okl{stroke:#2E7D32}
.pulse{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
