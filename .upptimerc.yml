owner: kreativ-anders # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

# A plain status check is not enough: Kirby answers its error pages with HTTP 200.
# Each site is therefore also marked down when a text from the real page is missing.
sites:
  - name: kreativ-anders.de
    url: https://kreativ-anders.de
    __dangerous__body_down_if_text_missing: "Service-Partner"
  - name: bookmark.cards
    url: https://bookmark.cards
    icon: https://bookmark.cards/apple-touch-icon.png
    __dangerous__body_down_if_text_missing: "Bookmark.cards"
  - name: News Reader
    url: https://news-reader.app
    __dangerous__body_down_if_text_missing: "News Reader"
  - name: Sustainable Web Analyzer
    url: https://swa.kreativ-anders.dev
    __dangerous__body_down_if_text_missing: "Sustainable Web Analyzer"
  - name: Wharf
    url: https://wharf.kreativ-anders.dev
    icon: https://wharf.kreativ-anders.dev/apple-touch-icon.png
    __dangerous__body_down_if_text_missing: "Wharf"
  - name: FinanzGecko
    url: https://finanzgecko.app
    __dangerous__body_down_if_text_missing: "FinanzGecko"
  - name: blowcookie.xyz
    url: https://blowcookie.xyz
    __dangerous__body_down_if_text_missing: "BlowCookies"
  - name: steinberg.agency
    url: https://steinberg.agency
    __dangerous__body_down_if_text_missing: "Steinberg Agency"

# Notification secrets passed to the workflows (SMS via 46elks)
secrets:
  - NOTIFICATION_SMS_46ELKS
  - NOTIFICATION_SMS_46ELKS_API_USERNAME
  - NOTIFICATION_SMS_46ELKS_API_PASSWORD
  - NOTIFICATION_SMS_FROM
  - NOTIFICATION_SMS_TO

workflowSchedule:
  uptime: "*/15 * * * *"

status-website:
  cname: status.kreativ-anders.dev
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: kreativ-anders Status
  introTitle: "**kreativ-anders** status"
  introMessage: >-
    Live status of our websites and apps, checked every 15 minutes.
    Checks run on GitHub servers in the USA, while several of our services are hosted in Germany.
    Their response times therefore include the round trip across the Atlantic and are higher than what visitors in Europe experience.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# See https://upptime.js.org/docs/configuration
